# 独立 local costmap → /costmap/costmap（RViz 显示，随 base_link 平移+旋转）
# MPPI 实际控制用 nav2_mppi_params 内嵌 costmap（global_frame=odom）
costmap:
  costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: base_link
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[-0.18, -0.15], [-0.18, 0.15], [0.18, 0.15], [0.18, -0.15]]"
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 0.72
        combination_method: 1
        observation_sources: livox_cloud
        livox_cloud:
          topic: /cloud_registered_body
          sensor_frame: imu_link
          data_type: "PointCloud2"
          observation_persistence: 0.0
          min_obstacle_height: 0.15
          max_obstacle_height: 0.72
          obstacle_max_range: 3.0
          obstacle_min_range: 0.05
          raytrace_max_range: 3.2
          raytrace_min_range: 0.05
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.18
      always_send_full_costmap: true
