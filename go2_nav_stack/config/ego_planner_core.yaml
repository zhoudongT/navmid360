# ego_planner_node 核心参数（Go2 四足，平面运动）
#
# 关键量含义：
#   obstacles_inflation — 栅格障碍膨胀半径 (m)
#   robot_exclusion_radius — 机身圆柱内点云不计障碍（防自扫闪烁）
#   optimization/dist0  — 轨迹与障碍目标安全距离 (m)
#   manager/use_raw_global_waypoints — true=沿 A* 全局折线跟踪，局部仅遇障绕开

/**:
  ros__parameters:
    fsm/flight_type: 1
    fsm/thresh_replan_time: 1.2
    fsm/thresh_no_replan_meter: 0.6
    # odom 距全局路径超过该值即 REPLAN（不等待轨迹时间）
    fsm/thresh_path_replan_meter: 0.70
    # PATH_DEV 最短间隔，避免 0.33m 贴边转弯时每周期 REPLAN
    fsm/path_replan_cooldown_sec: 2.0
    # 到终点距离长时间不下降时强制 REPLAN（防止跑偏后卡住）
    fsm/progress_replan_timeout_sec: 3.0
    fsm/progress_replan_min_drop_m: 0.35
    fsm/goal_arrival_z_tol: 0.20
    # 局部规划前视距离/时间（提高到 1.8m，提早绕障）
    fsm/planning_horizon: 1.8
    fsm/planning_horizen_time: 1.8
    fsm/emergency_time: 0.75
    fsm/realworld_experiment: false
    fsm/fail_safe: true
    fsm/waypoint_num: 1
    fsm/global_path_enable: true
    fsm/global_path_topic: /ego_global_path

    grid_map/resolution: 0.1
    grid_map/map_size_x: 40.0
    grid_map/map_size_y: 40.0
    grid_map/map_size_z: 6.0
    grid_map/local_update_range_x: 4.5
    grid_map/local_update_range_y: 4.5
    grid_map/local_update_range_z: 1.2
    # 障碍膨胀（栅格层），增大防贴墙
    grid_map/obstacles_inflation: 0.18
    # Go2 机身+腿扫到的点云剔除（略大于机体包络）
    grid_map/robot_exclusion_radius: 0.52
    grid_map/local_map_margin: 8
    grid_map/ground_height: 0.0
    grid_map/use_depth_filter: false
    grid_map/planar_occ_check: true
    grid_map/planar_occ_relative: true
    # 离地 0.15~1.0m（激光高度 0.45m）
    grid_map/planar_occ_z_min_offset: -0.30
    grid_map/planar_occ_z_max_offset: 0.55
    grid_map/planar_default_ref_z: 0.45
    grid_map/visualization_truncate_offset: 0.65
    grid_map/p_hit: 0.72
    grid_map/p_miss: 0.38
    grid_map/p_min: 0.12
    grid_map/p_max: 0.90
    grid_map/p_occ: 0.82
    grid_map/min_ray_length: 0.35
    grid_map/max_ray_length: 3.5
    grid_map/virtual_ceil_height: -1.0
    grid_map/show_occ_time: false
    grid_map/pose_type: 1
    grid_map/frame_id: map

    manager/max_vel: 0.40
    # 四足底盘动力学约束（避免按无人机高加减速规划）
    manager/max_acc: 1.0
    manager/max_jerk: 1.8
    manager/control_points_distance: 0.28
    manager/feasibility_tolerance: 0.05
    manager/planning_horizon: 1.8
    manager/use_distinctive_trajs: false
    manager/drone_id: 0
    manager/planar_mode: true
    manager/preserve_global_path_z: true
    manager/use_raw_global_waypoints: false
    manager/cruise_z: 0.27

    # 贴全局路径：fitness 大、collision 适中（有障碍才绕开）
    optimization/lambda_smooth: 2.0
    optimization/lambda_collision: 2.80
    optimization/lambda_feasibility: 0.1
    optimization/lambda_fitness: 1.20
    # 轨迹与膨胀障碍的目标间距 (m)，增大防撞墙
    optimization/dist0: 0.42
    optimization/swarm_clearance: 0.50
    optimization/max_vel: 0.40
    optimization/max_acc: 1.0

    bspline/limit_vel: 0.40
    bspline/limit_acc: 1.0
    bspline/limit_ratio: 1.1

    prediction/obj_num: 0
