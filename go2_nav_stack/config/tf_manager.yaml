tf_manager_node:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    lidar_frame: livox_frame
    publish_rate: 50.0
    tf_timeout: 0.3
    publish_odom_to_base: true
    publish_map_to_odom: true
    latch_map_to_odom: true
    seed_map_to_odom_identity: true
    odom_topic: /state_estimation
    static_base_to_imu_xyz: [0.0, 0.0, 0.0]
    static_base_to_imu_rpy: [0.0, 0.0, 0.0]
    static_base_to_lidar_xyz: [0.0, 0.0, 0.15]
    static_base_to_lidar_rpy: [0.0, 0.0, 0.0]
