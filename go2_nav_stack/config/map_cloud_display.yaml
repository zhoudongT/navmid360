map_cloud_display_node:
  ros__parameters:
    input_topic: /cloud_registered
    output_topic: /cloud_registered_map
    target_frame: map
    tf_timeout_sec: 0.25
    require_reloc_ok: true
    # true：map->odom 非连续高频，用 stamp 查 TF 会大量丢帧（EGO 仅 ~1Hz）；RViz 彩色图可接受轻微滞后
    use_latest_tf: true
    max_points: 16000
    min_publish_interval_sec: 0.05
