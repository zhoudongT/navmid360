# Nav2 局部：MPPI FollowPath + 滚动 costmap（Mid-360 点云避障）
# 独立节点发布 /costmap/costmap；MPPI 用 controller 内嵌 costmap（参数须与 local_costmap_standalone.yaml 一致）
# 全局路径由 mppi_path_follower 送入 FollowPath；遇障须 ObstaclesCritic/CostCritic 压过 PathFollow
# 内嵌 local_costmap 用 odom（MPPI 路径 map→odom）；RViz 独立 /costmap 仍用 base_link（见 standalone yaml）

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /nav2_odom
    costmap_update_timeout: 2.0
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.2
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 25.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"
      time_steps: 56
      model_dt: 0.05
      batch_size: 1024
      iteration_count: 1
      vx_std: 0.38
      vy_std: 0.05
      wz_std: 0.38
      vx_max: 0.50
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.35
      temperature: 0.45
      gamma: 0.010
      prune_distance: 1.2
      transform_tolerance: 1.0
      retry_attempt_limit: 12
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics:
        [
          "ConstraintCritic",
          "ObstaclesCritic",
          "CostCritic",
          "PathAngleCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PreferForwardCritic",
        ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 14.0
        critical_weight: 9.0
        collision_cost: 1000000.0
        consider_footprint: false
        collision_margin_distance: 0.04
        near_goal_distance: 0.6
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.6
        critical_cost: 245.0
        inflation_layer_name: "inflation_layer"
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.8
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.35
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.5
        threshold_to_consider: 0.5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        forward_preference: true
        offset_from_furthest: 4
        threshold_to_consider: 1.0
        max_angle_to_furthest: 1.2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 0.9
        max_path_occupancy_ratio: 0.45
        trajectory_point_step: 3
        threshold_to_consider: 1.2
        offset_from_furthest: 14
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5
        threshold_to_consider: 1.5
        offset_from_furthest: 6

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 15.0
      publish_frequency: 15.0
      # MPPI 控制：odom 滚动 + map 路径变换；与 RViz 独立 costmap（base_link）分离
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[-0.18, -0.15], [-0.18, 0.15], [0.18, 0.15], [0.18, -0.15]]"
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 0.72
        combination_method: 1
        observation_sources: livox_cloud
        livox_cloud:
          topic: /cloud_registered
          sensor_frame: odom
          data_type: "PointCloud2"
          # odom 滚动窗口可安全使用 persistence；RViz 独立 costmap（base_link）须为 0.0
          observation_persistence: 1.0
          min_obstacle_height: 0.15
          max_obstacle_height: 0.72
          obstacle_max_range: 3.0
          obstacle_min_range: 0.18
          raytrace_max_range: 3.2
          raytrace_min_range: 0.18
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.18
      always_send_full_costmap: true
