tf_manager_node:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    lidar_frame: livox_frame
    publish_rate: 50.0
    tf_timeout: 0.3
    publish_base_to_imu: true
    publish_odom_to_base: true
    publish_map_to_odom: true
    latch_map_to_odom: true
    allow_icp_refine: true
    icp_refine_min_interval_sec: 3.0
    spin_block_reloc_wz: 0.55
    spin_reloc_settle_sec: 2.5
    icp_refine_max_yaw_deg: 25.0
    icp_refine_max_xy_m: 0.6
    seed_map_to_odom_identity: false
    seed_odom_to_base_identity: true
    # 直接用 FAST-LIO（~10Hz）；planar_odom_filter 已从 bringup 移除
    odom_topic: /lio_odom_raw
    # 兼容旧 RViz/脚本；默认关闭，全栈以 /lio_odom_raw + TF 为准
    # map 系位姿：T_map_base = map->odom @ odom->base，~10Hz，供 EGO / RViz
    republish_state_estimation: true
    state_estimation_topic: /state_estimation
    # false：odom->base 与 LIO 的 odom->imu_link 同位姿（需 base_link->imu_link 单位阵）
    apply_lio_to_base_extrinsic: false
    republish_odom_to_base_on_timer: false
    planar_yaw_only: true
    lock_odom_z: true
    odom_z_fixed: 0.0
    # 转向时略平滑 yaw，减轻 LIO 滞后；快速转圈用更大 alpha 跟上
    yaw_smooth_alpha: 0.4
    yaw_smooth_alpha_spin: 0.88
    spin_angular_vel_threshold: 0.45
    # false：map->odom 时间戳与重定位对齐，勿 50Hz 刷 now()（会与 10Hz odom->base 错位导致飘）
    refresh_map_to_odom_stamp: false
    static_base_to_imu_xyz: [0.0, 0.0, 0.0]
    static_base_to_imu_rpy: [0.0, 0.0, 0.0]
    # base/imu/livox 三帧同点（机体/雷达）；足端在 base 下方 0.5m → base_footprint
    static_base_to_lidar_xyz: [0.0, 0.0, 0.0]
    static_base_to_lidar_rpy: [0.0, 0.0, 0.0]
    publish_base_footprint: true
    footprint_frame: base_footprint
    static_base_to_footprint_xyz: [0.0, 0.0, -0.5]
    static_base_to_footprint_rpy: [0.0, 0.0, 0.0]
