/**:
  ros__parameters:
    # Go2 背载 Mid-360：水平安装在机身顶部，扫描朝天（宇树 Edu+ 常见支架姿态）。
    # extrinsic_* 为 LiDAR 在机身 IMU 坐标系下的位姿（FAST-LIO 定义）。
    # 默认 Mid-360 内置 IMU（/livox/imu）。若改用 Go2 机身 IMU，改为 /imu/data 并调整 extrinsic：
    #   extrinsic_T: [ 0.17, 0.0, 0.45 ]
    feature_extract_enable: false
    point_filter_num: 3
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
    map_file_path: "./go2_session.pcd"

    common:
      odom_frame_id: "odom"
      sensor_frame_id: "imu_link"
      base_frame_id: "base_link"
      send_odom_base_tf: true
      lid_topic: "/livox/lidar"
      imu_topic: "/livox/imu"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      lidar_type: 1
      scan_line: 4
      blind: 0.2
      timestamp_unit: 3
      scan_rate: 10

    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0
      det_range: 100.0
      extrinsic_est_en: true
      extrinsic_T: [ 0.17, 0.0, 0.45 ]
      extrinsic_R: [ 1., 0., 0.,
                     0., 1., 0.,
                     0., 0., 1.]

    publish:
      path_en: true
      effect_map_en: false
      map_en: false
      scan_publish_en: true
      dense_publish_en: false
      scan_bodyframe_pub_en: true

    pcd_save:
      pcd_save_en: false
      interval: -1
