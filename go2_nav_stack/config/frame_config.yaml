# 导航栈统一坐标系与话题（对齐 导航地图与TF树关系说明.md 第 0 节）
/**:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    imu_frame: imu_link
    lidar_frame: livox_frame

    # TF 发布职责（勿改除非全栈一起改）
    map_to_odom_publisher: tf_manager_node
    odom_to_base_publisher: tf_manager_node
    base_to_lidar_publisher: tf_manager_node
    lidar_to_imu_publisher: fastlio2_localization.launch

    # 关键话题
    topic_lio_odom_raw: /lio_odom_raw
    # tf_manager 从 /lio_odom_raw 合成并 republish
    topic_lio_odom_raw: /lio_odom_raw
    topic_state_estimation: /state_estimation
    topic_cloud_registered: /cloud_registered
    topic_cloud_registered_map: /cloud_registered_map
    topic_transformed_cloud: /transformed_cloud
    topic_prior_map: /prior_map
    topic_planned_path: /planned_path
    topic_octomap: /octomap
    topic_reloc_pose: /relocalization/pose

    # 点云 / 地图 frame_id
    cloud_registered_frame: odom
    prior_map_frame: map
    planned_path_frame: map
    # 独立 RViz 局部 costmap：global_frame=base_link，随机体 TF 移动
    local_costmap_global_frame: base_link
