# Nav2 局部：MPPI FollowPath + 滚动 local_costmap（Mid-360 点云避障）
# 全局路径仍由 dong_path_node 发布 /planned_path，由 mppi_path_follower 送入 FollowPath action

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /state_estimation
    local_costmap: local_costmap/local_costmap
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"
      time_steps: 56
      model_dt: 0.05
      batch_size: 512
      iteration_count: 1
      vx_std: 0.2
      vy_std: 0.05
      wz_std: 0.45
      vx_max: 0.45
      vx_min: -0.25
      vy_max: 0.0
      wz_max: 0.8
      temperature: 0.3
      gamma: 0.015
      prune_distance: 0.8
      transform_tolerance: 0.3
      retry_attempt_limit: 4
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PreferForwardCritic",
        ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.8
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.35
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # 参考 dong_path /planned_path 各点朝向（终点=你设的 yaw，中间点=路径切线）
      # CostCritic 仍主导避障；path 被障碍占用时可放宽对齐（max_path_occupancy_ratio）
      # 跟随路径点姿态（由 mppi_path_follower 按前视距离写入）；不用 PathAngle（几何角会拉偏）
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.15
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 12
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 7.0
        threshold_to_consider: 0.5
        offset_from_furthest: 4

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 10.0
      # 与 dong_path /planned_path 的 map 系一致，避免路径变换失败导致 cmd_vel=0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      # 局部感兴趣区：以机器人为中心 3m×3m（width/height 必须为整数，单位米）
      width: 3
      height: 3
      resolution: 0.05
      # Go2 机身约 0.6x0.32m（base_link 中心），与 MPPI CostCritic consider_footprint 一致
      footprint: "[[-0.30, -0.16], [-0.30, 0.16], [0.30, 0.16], [0.30, -0.16]]"
      transform_tolerance: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        max_obstacle_height: 0.85
        combination_method: 1
        observation_sources: livox_cloud
        livox_cloud:
          topic: /cloud_registered
          sensor_frame: odom
          data_type: "PointCloud2"
          min_obstacle_height: 0.17
          max_obstacle_height: 0.80
          obstacle_max_range: 2.0
          obstacle_min_range: 0.05
          raytrace_max_range: 2.2
          raytrace_min_range: 0.05
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.35
      always_send_full_costmap: true
