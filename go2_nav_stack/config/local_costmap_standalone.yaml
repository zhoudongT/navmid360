# 独立 local_costmap 节点（nav2_costmap_2d 可执行文件内节点名固定为 costmap）
costmap:
  costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[-0.30, -0.16], [-0.30, 0.16], [0.30, 0.16], [0.30, -0.16]]"
      transform_tolerance: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        max_obstacle_height: 0.85
        combination_method: 1
        observation_sources: livox_cloud
        livox_cloud:
          topic: /cloud_registered
          sensor_frame: livox_frame
          data_type: "PointCloud2"
          min_obstacle_height: 0.17
          max_obstacle_height: 0.80
          obstacle_max_range: 2.0
          obstacle_min_range: 0.05
          raytrace_max_range: 2.2
          raytrace_min_range: 0.05
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.35
      always_send_full_costmap: true
