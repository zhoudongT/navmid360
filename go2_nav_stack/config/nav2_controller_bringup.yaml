nav2_controller_bringup:
  ros__parameters:
    # launch name=costmap + 可执行文件内层节点 costmap → lifecycle /costmap/costmap
    costmap_node: costmap/costmap
    controller_node: controller_server
    startup_delay_sec: 5.0
    node_wait_timeout_sec: 90.0
    costmap_configure_timeout_sec: 60.0
    costmap_activate_timeout_sec: 30.0
    configure_timeout_sec: 180.0
    activate_timeout_sec: 90.0
    retry_period_sec: 12.0
