icp_relocalizer:
  ros__parameters:
    prior_pcd_path: "/home/allen/maps/scans_0.5m.pcd"   # 与 FAST-LIO 先验图一致（map 系）
    scan_topic: "/cloud_registered"
    map_frame: "map"
    lidar_frame: "camera_init"
    voxel_size: 0.25
    crop_margin_m: 8.0
    max_correspondence_distance: 0.8
    icp_max_iterations: 40
    min_fitness: 0.08
    max_rmse: 0.35
    publish_tf: false    # true 时会广播 map->lidar TF，可能与 FAST-LIO 冲突，默认关闭
