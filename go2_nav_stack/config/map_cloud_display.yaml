map_cloud_display_node:
  ros__parameters:
    input_topic: /cloud_registered
    output_topic: /cloud_registered_map
    target_frame: map
    tf_timeout_sec: 0.25
    require_reloc_ok: true
    # false：用点云时间戳查 TF，转向时障碍与机体对齐；true 易在转圈时“拖影”
    use_latest_tf: false
    max_points: 16000
    min_publish_interval_sec: 0.05
