ego_go2_bridge:
  ros__parameters:
    drone_id: 0
    publish_state_estimation: false
    odom_input_topic: /lio_odom_raw
    # ICP 锁定后 FAST-LIO 常停 /cloud_registered；主用 map 系 /transformed_cloud（icp_node ~2Hz）
    cloud_input_topic: /transformed_cloud
    cloud_fallback_topic: /cloud_registered
    cloud_fallback_stale_sec: 0.4
    map_frame: map
    tf_timeout_sec: 0.8
    # 点云与 EGO 栅格中心必须用同一时刻 TF，勿用“最新 TF”
    prefer_cloud_stamp_tf: true
    cloud_tf_fallback_latest: true
    crop_tf_fallback_latest: true
    publish_grid_odom: true
    enable_cloud_z_crop: true
    # 四足建议用机体系高度过滤，避免 map z 漂移导致障碍被全部裁掉
    cloud_crop_in_base_frame: true
    # 障碍高度带（相对 base）：较原 0.17~1.0m 整体下移 0.35m
    obstacle_min_height_above_base_m: -0.18
    obstacle_max_height_above_base_m: 0.65
    cloud_z_min_m: -0.18
    cloud_z_max_m: 0.65
    robot_body_radius_m: 0.52
    cloud_stale_warn_sec: 0.35

ego_path_follower:
  ros__parameters:
    planned_path_topic: /planned_path
    ego_global_path_topic: /ego_global_path
    start_navigation_topic: /start_navigation
    stop_navigation_topic: /stop_navigation
    ego_goal_topic: /move_base_simple/goal
    ego_trigger_topic: /traj_start_trigger
    require_start_command: true
    # global_path：整段 /planned_path 一次发给 EGO；per_waypoint/lookahead 为旧逐点模式
    follow_mode: global_path
    lookahead_m: 2.0
    max_corner_yaw_deg: 80.0
    goal_z: 0.27
    preserve_path_z: true
    arrival_xy_m: 0.15
    arrival_z_m: 0.20
    yaw_arrival_deg: 60.0
    require_yaw_arrival: false
    stuck_advance_sec: 2.0
    stuck_advance_max_dist_m: 0.85
    stuck_advance_force_dwell_sec: 8.0
    follow_tick_hz: 10.0
    goal_heartbeat_sec: 1.0
    global_path_republish_sec: 0.0
    status_topic: /local_planner/status

ego_traj_display:
  ros__parameters:
    pos_cmd_topic: /drone_0_planning/pos_cmd
    bspline_topic: /drone_0_planning/bspline
    optimal_list_topic: /drone_0_plan_vis/optimal_list
    ego_path_topic: /ego_exec_path
    local_path_topic: /ego_local_path
    global_path_in: /planned_path
    global_path_viz_out: /planned_path_viz
    trail_max_points: 120
    local_path_segments: 10
    republish_hz: 2.0

ego_cmd_bridge:
  ros__parameters:
    pos_cmd_topic: /drone_0_planning/pos_cmd
    cmd_vel_topic: /cmd_vel
    map_frame: map
    base_frame: base_link
    tf_timeout_sec: 0.2
    max_vx: 0.40
    max_wz: 0.32
    kp_vx: 0.95
    kp_wz: 0.55
    ego_path_goal_topic: /move_base_simple/goal
    min_vx: 0.09
    near_goal_dist_m: 0.60
    near_goal_creep_vx: 0.10
    near_goal_max_wz: 0.28
    waypoint_yaw_weight: 0.35
    traj_yaw_weight: 0.75
    forward_only: true
    traj_ignore_extra_m: 0.75
    traj_min_follow_dist_m: 0.40
    traj_pos_lookahead_sec: 0.8
    couple_vx_wz: false
    stop_dist_cmd_m: 0.08
    stop_dist_path_goal_m: 0.12
    cmd_stale_sec: 2.0
    drive_without_pos_cmd: true
    cmd_rate_hz: 30.0
